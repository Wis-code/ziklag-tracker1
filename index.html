<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogoFlow Studio — Production Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: rgba(255,255,255,0.08);
    --teal: #4ecdc4;
    --teal-dim: rgba(78,205,196,0.1);
    --text: #f0f0f0;
    --text-muted: #9e9eae;
    --gold: #ffd250;
    --gold-bg: rgba(255,210,80,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding: 24px; }
  .container { max-width: 820px; margin: 0 auto; }
  
  header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; letter-spacing: 2px; cursor: pointer; }
  
  .btn { background: var(--teal); color: var(--bg); border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.9; }
  .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); margin-right: 8px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .view-panel { display: none; }
  .view-panel.active { display: block; }
  
  .project-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 20px; }
  .project-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; cursor: pointer; transition: transform 0.2s, border-color 0.2s; position: relative; }
  .project-card:hover { transform: translateY(-2px); border-color: var(--teal); }
  .project-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  
  .progress-bar-bg { width: 100%; height: 6px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .progress-bar-fill { height: 100%; background: var(--teal); width: 0%; transition: width 0.4s ease; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 12px; }
  .step-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 4px 0; }
  .step-body { padding-top: 16px; display: none; }
  .step-body.open { display: block; }
  
  .tip-box { background: var(--gold-bg); border: 1px solid rgba(255,210,80,0.2); border-radius: 8px; color: var(--gold); font-size: 13px; margin: 12px 0; padding: 12px; line-height: 1.5; }
  textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; color: white; resize: vertical; margin-bottom: 12px; font-family: inherit; outline: none; }
  textarea:focus { border-color: var(--teal); }
  input[type="file"] { margin-bottom: 16px; color: var(--text-muted); font-size: 13px; display: block; }
  input[type="text"], select { background: var(--surface2); border: 1px solid var(--border); padding: 12px; color: white; border-radius: 6px; outline: none; width: 100%; margin-bottom: 16px; }
  .track-badge { font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(78,205,196,0.3); color: var(--teal); }
  
  .back-link { color: var(--teal); font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; margin-bottom: 20px; font-weight: bold; }
  .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }

  /* Loading spinner */
  .loading-state { text-align: center; padding: 40px; color: var(--text-muted); }
  .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-badge { font-size: 11px; color: var(--teal); opacity: 0.7; margin-left: 8px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 onclick="showView('home')">◈ LOGOFLOW</h1>
    <button id="nav-action-btn" class="btn" onclick="showView('create')">+ New Project</button>
  </header>

  <div id="view-home" class="view-panel active">
    <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 24px;">
      Active Brand Pipelines
      <span id="sync-status" class="sync-badge"></span>
    </h2>
    <div id="project-list-container" class="project-grid"></div>
  </div>

  <div id="view-create" class="view-panel">
    <div class="back-link" onclick="showView('home')">← Back to Dashboard</div>
    <div class="card" style="max-width: 500px; margin: 0 auto;">
      <h3 style="margin-bottom: 20px; font-family: 'Cormorant Garamond', serif; font-size: 24px;">Initialize New Studio Pipeline</h3>
      
      <label style="display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px;">CLIENT OR BUSINESS NAME</label>
      <input type="text" id="client-name-input" placeholder="e.g. Wiscode Tech, Ziklag Labs...">
      
      <label style="display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px;">WORKFLOW FRAMEWORK TRACK</label>
      <select id="track-select">
        <option value="logo">Standard Logo Architecture (15 Steps)</option>
        <option value="branding" selected>Full Brand Identity Framework (22 Steps)</option>
      </select>
      
      <button class="btn" style="width: 100%; padding: 14px;" onclick="createNewProjectInstance()">Launch Project Engine</button>
    </div>
  </div>

  <div id="view-workspace" class="view-panel">
    <div class="back-link" onclick="showView('home')">← Save & Back to Project Hub</div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; flex-wrap: wrap; gap: 8px;">
      <h2 id="active-project-title" style="font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--text);"></h2>
      <span id="active-project-track" class="track-badge"></span>
    </div>
    <div id="steps-timeline-container"></div>
  </div>
</div>

<script>
const LOGO_STEPS = [
  { id: 1, icon: '📋', title: 'Client Intake & Brief', desc: 'Collect all client info: business name, industry, target market, competitors, style preferences, deliverables needed, timeline, and budget.', tip: 'The more detail you get here, the less back-and-forth later. Use an open discovery call to catch unique properties.' },
  { id: 2, icon: '🔍', title: 'Competitor Research', desc: 'Study 3–5 direct competitors. Note their logo styles, corporate color tracks, typography layouts, and overall identity positioning.', tip: 'Identify operational gaps and distinct creative vectors so the new brand can stand completely apart.' },
  { id: 3, icon: '👥', title: 'Target Audience Profile', desc: 'Define who the brand speaks to. Build an absolute customer persona profile tracking age brackets, occupational values, goals, and daily pain points.', tip: 'Remember: you are NOT the target audience. Step back and design explicitly for their specific consumer lens.' },
  { id: 4, icon: '🎯', title: 'Brand Positioning Scales', desc: 'Rate and quantify the brand across key alignment scales: price metrics (low–high), style treatments (modern–traditional), tone (bold–reserved).', tip: 'Share these positioning scales directly with the client — it sparks excellent conversation and narrows down the style path.' },
  { id: 5, icon: '🖼️', title: 'Style Direction — Mood Boards', desc: 'Curate photos, typography examples, and color textures from free stock hubs (Pexels, Unsplash) to build out 2 to 3 distinct visual stylescapes.', tip: 'Aim for style directions that feel genuinely different (e.g., safe choice vs. extreme left-field vector). Never present just one option.' },
  { id: 6, icon: '💬', title: 'Client Direction Lockup', desc: 'Present mood boards to the client to gain definitive clarity. Narrow down to one agreed visual track before touching actual vector geometry.', tip: 'This layout lockup prevents hours of wasted production time down the road.' },
  { id: 7, icon: '🧠', title: 'Word Mapping & Brainstorm', desc: 'Write down key words associated with the brand bubbles. Free branch out from each text block to uncover secondary concepts, shapes, and symbols.', tip: 'Unexpected connections between abstract words often mutate into your most successful design marks.' },
  { id: 8, icon: '✏️', title: 'Thumbnail Sketching', desc: 'Rough sketch concepts by hand or via mobile tools. Explore distinct category layouts: Monogram, Abstract, Wordmark, Combination, Mascot, Emblem.', tip: 'It does NOT have to be pretty. Sketch in separate quick bursts and look for beautiful structural accidents.' },
  { id: 9, icon: '💻', title: 'Vectorize Concepts', desc: 'Bring your strongest napkin sketches into vector software. Trace your draft concepts into clean, mathematically precise geometric layers.', tip: 'Test your vector mark at tiny mobile resolutions (100x100 pixels) early. If it loses visual clarity, simplify immediately.' },
  { id: 10, icon: '🔤', title: 'Typography Pairings Study', desc: 'Select font pairings that reinforce the brand temperament. Establish explicit system rules: Headline size, leading, tracking spaces, and casing limits.', tip: 'All caps = strong & stable. Lowercase = approachably soft. Wide letter tracking = luxury.' },
  { id: 11, icon: '🎨', title: 'Color Palette System', desc: 'Develop the versatile color palette. Define absolute coordinate numbers for each tone: HEX codes, RGB web metrics, and CMYK print ink formulas.', tip: 'Test all color definitions together in context on real mockups — never look at swatches in total isolation.' },
  { id: 12, icon: '📐', title: 'Logo Matrix Variations', desc: 'Build required functional variations: standard horizontal lockup, vertical stack, icon-only mark, and responsive mobile header layouts.', tip: 'Test every layout matrix on both pure light and deep dark background contrasts to ensure flexible visibility.' },
  { id: 13, icon: '📏', title: 'Clear Space Spacing Rules', desc: 'Define border margins around the logo boundaries using an invisible 1x unit-based structural system.', tip: 'Avoid setting pixel-specific spacing measurements — they fail to translate cleanly between print and digital mediums.' },
  { id: 14, icon: '🖥️', title: 'Concept Deck Presentation', desc: 'Assemble a professional case-study deck displaying the strategy rationale behind design choices. Start in B&W to focus on concept strength.', tip: 'Never present more than 3 concepts. Your goal is to guide the client to narrow the batch down to 1 definitive choice.' },
  { id: 15, icon: '📦', title: 'Final File Delivery Package', desc: 'Package and deliver final file extensions organized neatly inside labelled directory folders: AI, EPS, PDF, transparent PNG, SVG.', tip: 'Include a brief "how to use your logo" read-me note block so the client doesn\'t misuse asset files downstream.' }
];

const BRANDING_EXTRA = [
  { id: 16, icon: '🗣️', title: 'Brand Language & Voice', desc: 'Define the brand\'s tone parameters, messaging characteristics, and core phrases. Write sample headlines and taglines.', tip: 'Brand voice copy must feel consistent across ALL consumer touchpoints. Write a paragraph in voice to test it.' },
  { id: 17, icon: '📸', title: 'Photo Style Rules', desc: 'Define what types of photography support the brand narrative. Create rules covering subject focal points, lighting, and background tones.', tip: 'Be specific (e.g., natural sun highlight flare, shallow depth of field, candid real people-focused, no corporate stock look).' },
  { id: 18, icon: '🎭', title: 'Supporting Brand Assets', desc: 'Create supporting visual assets extending beyond the logo: custom icon libraries, textures, background patterns, or geometric graphics.', tip: 'Tailor asset types to real industry use cases (e.g., wayfinding layout icons for store spaces, patterns for digital headers).' },
  { id: 19, icon: '📚', title: 'Full Identity Presentation', desc: 'Assemble the complete identity presentation deck combining your audience research, system rules, and collateral mockup rendering blocks.', tip: 'Structure the deck to show the whole unified corporate vision in action to impress the client.' },
  { id: 20, icon: '📖', title: 'Branding Guidelines Manual', desc: 'Convert your color systems, font pairings, and placement restrictions into a formal, multi-page Standards Guide PDF manual.', tip: 'This is an add-on service — charge extra for it! Since you followed this process, most data parameters are already documented.' },
  { id: 21, icon: '🎁', title: 'Collateral Applications', desc: 'Apply the system rules to real-world corporate collateral mockups relevant to the client: business cards, letterheads, or packaging sheets.', tip: 'Show the brand working on real objects using high-res Photoshop mockups — this is what truly sells the identity.' },
  { id: 22, icon: '🚀', title: 'Final System Delivery', desc: 'Package and ship the complete asset inventory library: logo vectors, standards guide PDF, color palettes, and template layout links.', tip: 'Conduct a final walk-through call to explain usage rules. Offer a brand management retainer support package as an upsell.' }
];

// ─── State ────────────────────────────────────────────────
let projects = [];
let currentProjectId = null;
const FUNCTION_URL = 'https://script.google.com/macros/s/AKfycbxXMXphQtjqtE-ovtXbqOsSl8Uqtz2e0JxHPlKX080Jl3wcLYlH8UX3CAaRmkeSZB4A/exec';

// ─── Sheet Sync ───────────────────────────────────────────
async function loadProjectsFromSheet() {
  const container = document.getElementById('project-list-container');
  const syncStatus = document.getElementById('sync-status');

  // Show spinner while loading
  container.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Syncing pipelines from cloud...</p>
    </div>`;
  syncStatus.textContent = '↻ syncing...';

  try {
    const res = await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'loadProjects' }),
      redirect: 'follow'
    });
    const data = await res.json();

    if (data.projects && Array.isArray(data.projects)) {
      projects = data.projects;
      // Merge with any local-only projects (created while offline)
      const localProjects = JSON.parse(localStorage.getItem('logoflow_projects') || '[]');
      localProjects.forEach(lp => {
        if (!projects.find(p => p.id === lp.id)) {
          projects.unshift(lp);
        }
      });
      localStorage.setItem('logoflow_projects', JSON.stringify(projects));
      syncStatus.textContent = '✓ synced';
    } else {
      throw new Error('Bad response');
    }
  } catch (err) {
    // Fall back to localStorage if network fails
    projects = JSON.parse(localStorage.getItem('logoflow_projects') || '[]');
    syncStatus.textContent = '⚠ offline cache';
  }

  renderDashboardList();
}

async function saveProjectToSheet(project) {
  try {
    await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'saveProject', project }),
      redirect: 'follow'
    });
  } catch (err) {
    console.warn('Sheet save failed, stored locally only:', err);
  }
  // Always keep localStorage in sync as backup
  localStorage.setItem('logoflow_projects', JSON.stringify(projects));
}

// ─── Views ────────────────────────────────────────────────
function showView(viewName) {
  document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));
  document.getElementById(`view-${viewName}`).classList.add('active');

  const navBtn = document.getElementById('nav-action-btn');
  if (viewName === 'home') {
    navBtn.style.display = 'block';
    loadProjectsFromSheet(); // Always re-sync when returning home
  } else {
    navBtn.style.display = 'none';
  }
}

function renderDashboardList() {
  const container = document.getElementById('project-list-container');
  if (projects.length === 0) {
    container.innerHTML = `<div class="empty-state card"><h3>No clients initialized yet</h3><p style="margin-top:8px;">Click "+ New Project" above to setup your pipeline tracking grid.</p></div>`;
    return;
  }

  let html = '';
  projects.forEach(project => {
    const totalSteps = project.track === 'branding' ? 22 : 15;
    const completedCount = project.completedSteps ? Object.keys(project.completedSteps).length : 0;
    const percentage = Math.round((completedCount / totalSteps) * 100);

    html += `
      <div class="project-card" onclick="openProjectWorkspace('${project.id}')">
        <div class="project-meta">
          <strong style="font-size:18px; letter-spacing:0.3px;">${project.name}</strong>
          <span class="track-badge">${project.track.toUpperCase()} TIMELINE</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted);">
          <span>Pipeline Status</span>
          <span style="color:var(--teal); font-weight:bold;">${completedCount} / ${totalSteps} Blocks (${percentage}%)</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width: ${percentage}%"></div>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

async function createNewProjectInstance() {
  const nameInput = document.getElementById('client-name-input');
  const name = nameInput.value.trim();
  const track = document.getElementById('track-select').value;

  if (!name) { alert("Please supply a valid Client Identity Name."); return; }

  const newProject = {
    id: 'proj_' + Date.now(),
    name: name,
    track: track,
    completedSteps: {},
    notesCache: {}
  };

  projects.unshift(newProject);
  localStorage.setItem('logoflow_projects', JSON.stringify(projects));
  nameInput.value = '';

  // Save to sheet in background
  saveProjectToSheet(newProject);

  openProjectWorkspace(newProject.id);
}

function openProjectWorkspace(id) {
  currentProjectId = id;
  const project = projects.find(p => p.id === id);

  document.getElementById('active-project-title').innerText = `◈ Workspace: ${project.name}`;
  document.getElementById('active-project-track').innerText = `${project.track.toUpperCase()} PROCESS ENGINE`;

  let baseSteps = [...LOGO_STEPS];
  if (project.track === 'branding') { baseSteps = [...baseSteps, ...BRANDING_EXTRA]; }

  let html = '';
  baseSteps.forEach(step => {
    const isDone = project.completedSteps[step.id] ? true : false;
    const savedNote = project.notesCache[step.id] || '';
    const leftBorderStyles = isDone ? 'style="border-left: 4px solid var(--teal);"' : '';

    html += `
      <div class="card" id="card-${step.id}" ${leftBorderStyles}>
        <div class="step-header" onclick="document.getElementById('body-${step.id}').classList.toggle('open')">
          <span style="font-weight:bold; font-size:15px;">${step.icon} Step ${step.id}: ${step.title} ${isDone ? '✓' : ''}</span>
          <span class="track-badge" style="color:${isDone ? 'var(--teal)' : 'var(--text-muted)'}">${isDone ? 'LOCKED' : 'PENDING'}</span>
        </div>
        <div class="step-body ${step.id === 1 && !isDone ? 'open' : ''}" id="body-${step.id}">
          <p style="color:var(--text-muted); font-size:14px; line-height:1.6;">${step.desc}</p>
          <div class="tip-box">${step.tip}</div>
          <textarea id="note-${step.id}" rows="3" placeholder="Scribble notes, research pointers, or creative rules..." oninput="saveNotesLocally(${step.id})">${savedNote}</textarea>
          <label style="display:block; font-size:11px; margin-bottom:6px; color:var(--teal); font-weight:bold;">ATTACH LAYOUT SCREENSHOT LINK</label>
          <input type="file" id="file-${step.id}" accept="image/*">
          <button class="btn" id="btn-sync-${step.id}" style="width:100%; padding:12px;" onclick="pushMilestoneToCloud(${step.id})">
            ${isDone ? '✓ Update Tracking Rows & Sync' : '✓ Mark Complete & Push Downstream'}
          </button>
        </div>
      </div>
    `;
  });

  document.getElementById('steps-timeline-container').innerHTML = html;
  showView('workspace');
}

function saveNotesLocally(stepId) {
  const project = projects.find(p => p.id === currentProjectId);
  const textVal = document.getElementById(`note-${stepId}`).value;
  project.notesCache[stepId] = textVal;
  localStorage.setItem('logoflow_projects', JSON.stringify(projects));
  // Debounced sheet save
  clearTimeout(window._notesSaveTimer);
  window._notesSaveTimer = setTimeout(() => saveProjectToSheet(project), 2000);
}

async function pushMilestoneToCloud(stepId) {
  const project = projects.find(p => p.id === currentProjectId);
  const syncBtn = document.getElementById(`btn-sync-${stepId}`);
  const notes = document.getElementById(`note-${stepId}`).value;
  const fileInput = document.getElementById(`file-${stepId}`);

  let assetUrl = "No Attachments Saved";
  if (fileInput.files.length > 0) {
    assetUrl = `https://logoflow.studio/vault/assets/${fileInput.files[0].name}`;
  }

  syncBtn.disabled = true;
  syncBtn.innerText = "Syncing with Google Sheets...";

  try {
    const response = await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      redirect: 'follow',
      body: JSON.stringify({
        action: 'saveMilestone',
        clientName: project.name,
        track: project.track,
        stepTitle: `Step ${stepId} - ${[...LOGO_STEPS, ...BRANDING_EXTRA].find(s => s.id === stepId)?.title}`,
        notes: notes,
        fileUrl: assetUrl
      })
    });

    if (response.ok) {
      alert(`🎉 Database Updated! Milestone synchronized cleanly.`);
      project.completedSteps[stepId] = true;

      // Save updated project state to sheet + localStorage
      await saveProjectToSheet(project);

      document.getElementById(`card-${stepId}`).style.borderLeft = "4px solid var(--teal)";
      document.getElementById(`body-${stepId}`).classList.remove('open');

      const nextBlock = document.getElementById(`body-${stepId + 1}`);
      if (nextBlock) nextBlock.classList.add('open');
    } else {
      alert("Function responded with an error status. Confirm your Google Sheet Sharing settings are turned to Editor.");
    }
  } catch (err) {
    console.error(err);
    alert("Communication link failed. Check network states.");
  } finally {
    syncBtn.disabled = false;
    syncBtn.innerText = "✓ Update Tracking Rows & Sync";
  }
}

// Initial load — pull from sheet
loadProjectsFromSheet();
</script>
</body>
</html>
